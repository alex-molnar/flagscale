apiVersion: v1
kind: ServiceAccount
metadata:
  name: grayscale-pipeline-sa
  namespace: grayscale
---
apiVersion: v1
kind: Secret
metadata:
  name: grayscale-pipeline-sa-token
  namespace: grayscale
  annotations:
    kubernetes.io/service-account.name: grayscale-pipeline-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grayscale-pipeline-sa-admin
  namespace: grayscale
subjects:
  - kind: ServiceAccount
    name: grayscale-pipeline-sa
    namespace: grayscale
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-admin
  namespace: invertedle
subjects:
  - kind: ServiceAccount
    name: grayscale-pipeline-sa
    namespace: grayscale
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
